name: Analyzer CI

on:
  push:
    paths:
      - "services/analyzer/**"
      - ".github/workflows/analyzer-ci.yml"
  pull_request:
    paths:
      - "services/analyzer/**"
      - ".github/workflows/analyzer-ci.yml"

permissions:
  contents: read

concurrency:
  group: analyzer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/analyzer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile application
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest --quiet
